version: '3.9'

services:
  db:
    image: timescale/timescaledb:2.11.0-pg15
    container_name: irrigate_db
    environment:
      POSTGRES_DB: irrigate_db
      POSTGRES_USER: irrigate_user
      POSTGRES_PASSWORD: irrigate_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrigate_user -d irrigate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: irrigate_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: irrigate_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log

  web:
    build: .
    container_name: irrigate_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py create_demo_data &&
             gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker
             --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgres://irrigate_user:irrigate_pass@db:5432/irrigate_db
      - REDIS_URL=redis://redis:6379/0
      - MQTT_HOST=mqtt
      - DEBUG=True
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    container_name: irrigate_celery
    command: celery -A config worker -l info --concurrency 2
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgres://irrigate_user:irrigate_pass@db:5432/irrigate_db
      - REDIS_URL=redis://redis:6379/0
      - MQTT_HOST=mqtt
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: irrigate_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgres://irrigate_user:irrigate_pass@db:5432/irrigate_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  mqtt_listener:
    build: .
    container_name: irrigate_mqtt_listener
    command: python manage.py mqtt_listen
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgres://irrigate_user:irrigate_pass@db:5432/irrigate_db
      - REDIS_URL=redis://redis:6379/0
      - MQTT_HOST=mqtt
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - mqtt

  nginx:
    image: nginx:1.25-alpine
    container_name: irrigate_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - web

volumes:
  pgdata:
  redis_data:
  media_data:
  static_data:
  mqtt_data:
  mqtt_logs:
