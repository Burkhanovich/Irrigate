{% extends 'base.html' %}
{% block title %}Sensorni o'chirish — IrriGate{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger shadow-sm">
            <div class="card-body text-center p-5">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
                <h5 class="mt-3">Sensorni o'chirishni tasdiqlang</h5>
                <p class="text-muted">
                    <strong>{{ sensor.device_id }}</strong> sensorini o'chirmoqchimisiz?
                    Barcha o'lchov ma'lumotlari ham o'chiriladi.
                </p>
                <div class="d-flex gap-2 justify-content-center mt-4">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-2"></i>Ha, o'chirish
                        </button>
                    </form>
                    <a href="{% url 'sensor-detail' sensor.pk %}" class="btn btn-outline-secondary">Bekor qilish</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
